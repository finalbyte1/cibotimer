<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E2E54" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#091A2E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#060B12" stop-opacity="0"/>
    </radialGradient>

    <!-- Spoon Gradient (Cobalt Fasting Energy) -->
    <linearGradient id="spoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Fork Gradient (Electric Cyan Meal Window) -->
    <linearGradient id="forkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Spoon Scoop Depth Gradient -->
    <linearGradient id="scoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- High-res Soft Glow Filter -->
    <filter id="softNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND LAYER ================= -->
  <!-- Base OLED Sapphire -->
  <rect width="108" height="108" fill="#060B12"/>
  <!-- Ambient Center Disc -->
  <circle cx="54" cy="54" r="50" fill="url(#bgGlow)"/>
  <circle cx="54" cy="54" r="42" fill="#0C2542" fill-opacity="0.55"/>
  <circle cx="54" cy="54" r="34" fill="#0E335C" fill-opacity="0.4"/>

  <!-- Safe Area Circular Guide (72dp diameter) -->
  <circle cx="54" cy="54" r="36" fill="none" stroke="#1E3A5F" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.5"/>
  <circle cx="54" cy="18" r="1.1" fill="#00E5FF" fill-opacity="0.5"/>
  <circle cx="90" cy="54" r="1.1" fill="#00E5FF" fill-opacity="0.5"/>
  <circle cx="54" cy="90" r="1.1" fill="#00E5FF" fill-opacity="0.5"/>
  <circle cx="18" cy="54" r="1.1" fill="#00E5FF" fill-opacity="0.5"/>

  <!-- ================= FOREGROUND LAYER ================= -->
  <!-- Central Soft Ambient Aura -->
  <circle cx="54" cy="54" r="16" fill="#00E5FF" fill-opacity="0.12"/>

  <!-- Inactive Circular Timer Track -->
  <circle cx="54" cy="54" r="27" fill="none" stroke="#112338" stroke-width="3.6" stroke-linecap="round"/>

  <!-- FASTING ARC (Cobalt Blue, 240 deg, 1 o'clock to 9 o'clock) -->
  <path d="M 67.5,30.62 A 27,27 0 1,1 27,54" fill="none" stroke="#0284C7" stroke-width="7.5" stroke-linecap="round" stroke-opacity="0.25"/>
  <path d="M 67.5,30.62 A 27,27 0 1,1 27,54" fill="none" stroke="#0284C7" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Sky Azure Arc Highlight (1 o'clock to 3 o'clock) -->
  <path d="M 67.5,30.62 A 27,27 0 0,1 81,54" fill="none" stroke="#38BDF8" stroke-width="3.8" stroke-linecap="round" stroke-opacity="0.88"/>

  <!-- EATING WINDOW ARC (Electric Cyan Neon, 120 deg, 9 o'clock to 1 o'clock) -->
  <path d="M 27,54 A 27,27 0 0,1 67.5,30.62" fill="none" stroke="#00E5FF" stroke-width="9" stroke-linecap="round" stroke-opacity="0.35"/>
  <path d="M 27,54 A 27,27 0 0,1 67.5,30.62" fill="none" stroke="#00E5FF" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 27,54 A 27,27 0 0,1 67.5,30.62" fill="none" stroke="#00E5FF" stroke-width="3.8" stroke-linecap="round"/>

  <!-- INDICATOR JEWEL ("Puntino all'inizio dell'anello a sinistra" - 9 o'clock, x=27, y=54) -->
  <circle cx="27" cy="54" r="5.8" fill="#00E5FF" fill-opacity="0.28"/>
  <circle cx="27" cy="54" r="3.4" fill="#00E5FF"/>
  <circle cx="27" cy="54" r="1.6" fill="#FFFFFF"/>

  <!-- ================= CROSSED CUTLERY: SPOON & FORK ================= -->
  <!-- 1. SPOON (Cobalt Blue Fasting Utensil - points top-right to Fasting Window) -->
  <path d="M 67.44,40.56 C 69.13,42.26 68.28,45.37 65.67,47.99 C 63.05,50.61 60.58,50.96 58.74,50.96 L 45.3,64.39 C 43.75,66.09 42.76,67.51 41.77,67.79 C 40.92,67.93 40.07,67.08 40.21,66.23 C 40.49,65.24 41.91,64.25 43.61,62.7 L 57.04,49.26 C 57.04,47.42 57.39,44.95 60.01,42.33 C 62.63,39.72 65.74,38.87 67.44,40.56 Z" fill="url(#spoonGrad)"/>
  <!-- Spoon Inner Bowl Scoop -->
  <path d="M 66.37,41.63 C 67.65,42.9 66.8,45.3 64.89,47.21 C 62.98,49.12 60.86,49.55 58.95,49.05 C 58.45,47.14 58.88,45.02 60.79,43.11 C 62.7,41.2 65.1,40.35 66.37,41.63 Z" fill="url(#scoopGrad)"/>
  <!-- Spoon Specular Rim Highlight -->
  <path d="M 67.01,40.99 C 65.6,39.58 63.19,40.28 60.93,42.54 C 59.52,43.96 58.81,45.51 58.67,46.79 C 59.09,45.51 60.08,44.24 61.21,43.11 C 62.91,41.41 65.17,40.56 66.3,41.7 Z" fill="#38BDF8" fill-opacity="0.9"/>

  <!-- 2. INTERSECTION CUTOUT GAP (Separates Fork and Spoon with 3D Depth) -->
  <path d="M 50.5,50.5 L 57.5,57.5" stroke="#060B12" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 3. FORK (Electric Cyan Neon Eating Utensil - points top-left to Eating Window) -->
  <path d="M 38.02,43.11 C 40.14,45.23 43.61,48.13 45.3,49.26 C 47,50.39 48.48,50.32 49.26,50.96 L 62.7,64.39 C 64.25,66.09 65.24,67.51 66.23,67.79 C 67.08,67.93 67.93,67.08 67.79,66.23 C 67.51,65.24 66.09,64.25 64.39,62.7 L 50.96,49.26 C 50.32,48.48 50.39,47 49.26,45.3 C 48.13,43.61 45.23,40.14 43.11,38.02 L 42.26,38.87 C 43.68,40.28 46.58,43.32 47.14,44.17 C 47.49,44.67 46.86,45.3 46.36,44.95 L 40.99,40.14 L 40.14,40.99 L 44.95,46.36 C 45.3,46.86 44.67,47.49 44.17,47.14 C 43.32,46.58 40.28,43.68 38.87,42.26 Z" fill="url(#forkGrad)"/>
  <!-- Fork Center Specular Spine -->
  <path d="M 40.92,41.34 L 41.34,40.92 L 49.9,49.62 L 49.62,49.9 Z" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
